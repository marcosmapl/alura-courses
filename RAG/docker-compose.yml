version: "3.8"

services:
  vectorstore:
    build:
      context: .
      dockerfile: ./vectorstore_api/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/docs"]
      interval: 50s
      timeout: 25s
      retries: 3

  query:
    build:
      context: .
      dockerfile: ./query_api/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      vectorstore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/docs"]
      interval: 100s
      timeout: 50s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      query:
        condition: service_healthy
    environment:
      - VECTOR_STORE_API_URL=http://query:8001
      - QUERY_API_URL=http://query:8002
      - STREAMLIT_SERVER_PORT=8501
